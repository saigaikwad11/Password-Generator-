<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - GH Raisoni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 100px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.03);
            z-index: 0;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            letter-spacing: 10px;
        }

        .college-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            opacity: 0;
            animation: fadeInBadge 1s ease-in-out 10s forwards;
        }

        @keyframes fadeInBadge {
            to { opacity: 1; }
        }

        .college-badge h3 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Rocket Launch Animation */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1a0000, #000000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }

        .intro-screen.phase1 {
            animation: none;
        }

        .intro-screen.phase2 {
            background: radial-gradient(circle at center, #001a33, #000511);
            animation: zoomToEarth 3s ease-in-out 5s forwards;
        }

        .intro-screen.complete {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        @keyframes zoomToEarth {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }

        /* Mars Surface */
        .mars-surface {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, #8B4513, #CD853F);
            border-radius: 50% 50% 0 0;
            animation: marsShake 0.5s ease-in-out 2s;
        }

        @keyframes marsShake {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-10px); }
            75% { transform: translateY(-5px); }
        }

        /* Stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Rocket */
        .rocket {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            animation: rocketLaunch 4s ease-in-out forwards;
            filter: drop-shadow(0 0 20px rgba(255, 100, 0, 0.8));
        }

        @keyframes rocketLaunch {
            0% {
                bottom: 30%;
                transform: translateX(-50%) rotate(0deg) scale(1);
            }
            10% {
                transform: translateX(-50%) rotate(-5deg) scale(1.05);
            }
            20% {
                transform: translateX(-50%) rotate(5deg) scale(1.05);
            }
            40% {
                bottom: 50%;
                transform: translateX(-50%) rotate(0deg) scale(1.2);
            }
            100% {
                bottom: 150%;
                transform: translateX(-50%) rotate(0deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Fire Trail */
        .fire-trail {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 100px;
            animation: fireGrow 4s ease-in-out forwards;
        }

        @keyframes fireGrow {
            0% {
                height: 0;
                opacity: 0;
            }
            20% {
                height: 150px;
                opacity: 1;
            }
            100% {
                height: 400px;
                opacity: 0;
                bottom: 150%;
            }
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background: radial-gradient(circle, #ffff00, #ff6600, #ff0000);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flameFlicker 0.1s infinite;
        }

        @keyframes flameFlicker {
            0%, 100% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(1.1); }
        }

        /* Intro Text */
        .intro-text {
            position: absolute;
            text-align: center;
            color: white;
            z-index: 10;
            opacity: 0;
        }

        .intro-text.show {
            animation: fadeInText 1s ease-in-out forwards;
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }

        .hello {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .engineers {
            font-size: 64px;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Earth Zoom */
        .earth-container {
            position: absolute;
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        .earth-container.show {
            animation: earthAppear 2s ease-in-out 5s forwards;
        }

        @keyframes earthAppear {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .earth {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            position: relative;
            box-shadow: inset -20px -20px 50px rgba(0, 0, 0, 0.5),
                        0 0 50px rgba(0, 150, 255, 0.5);
            animation: earthRotate 10s linear infinite;
        }

        @keyframes earthRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .continent {
            position: absolute;
            background: #2d5016;
            border-radius: 50%;
        }

        .continent:nth-child(1) {
            width: 80px;
            height: 60px;
            top: 30%;
            left: 20%;
            border-radius: 60% 40% 40% 60%;
        }

        .continent:nth-child(2) {
            width: 60px;
            height: 70px;
            top: 40%;
            right: 25%;
            border-radius: 40% 60% 60% 40%;
        }

        .continent:nth-child(3) {
            width: 50px;
            height: 40px;
            bottom: 25%;
            left: 35%;
            border-radius: 50%;
        }

        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
            animation: cloudMove 8s ease-in-out infinite;
        }

        @keyframes cloudMove {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Main Content */
        .main-content {
            opacity: 0;
            animation: fadeIn 2s ease-in-out 10s forwards;
            padding: 80px 20px 40px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .hero-section {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 1;
        }

        .project-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(45deg, #00d4ff, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.4)); }
            to { filter: drop-shadow(0 0 40px rgba(0, 255, 136, 0.6)); }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .cyber-images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .cyber-card {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cyber-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .cyber-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: rgba(0, 255, 136, 0.6);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
        }

        .cyber-icon {
            font-size: 80px;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .password-display {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.3s;
        }

        .password-display:hover {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        #passwordOutput {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #00ff88;
            word-break: break-all;
            flex: 1;
            min-height: 24px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .copy-btn {
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #0f0c29;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }

        .options {
            margin-bottom: 30px;
        }

        .option-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            cursor: pointer;
            border: none;
        }

        .length-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .length-value {
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #0f0c29;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #00ff88;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #0f0c29;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.5);
        }

        .strength-meter {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .strength-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .strength-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s;
            border-radius: 5px;
            box-shadow: 0 0 20px currentColor;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #0f0c29;
            padding: 18px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .project-title {
                font-size: 40px;
                letter-spacing: 4px;
            }
            
            .cyber-card {
                width: 150px;
                height: 150px;
            }
            
            .cyber-icon {
                font-size: 60px;
            }

            .hello {
                font-size: 32px;
            }

            .engineers {
                font-size: 40px;
            }

            .rocket {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="watermark">SAI AND TEAM</div>
    
    <div class="college-badge">
        <h3>GH RAISONI</h3>
    </div>

    <!-- Intro Screen -->
    <div class="intro-screen phase1" id="introScreen">
        <!-- Stars -->
        <div class="stars" id="starsContainer"></div>
        
        <!-- Mars Surface -->
        <div class="mars-surface"></div>
        
        <!-- Fire Trail -->
        <div class="fire-trail">
            <div class="flame"></div>
        </div>
        
        <!-- Rocket -->
        <div class="rocket">🚀</div>
        
        <!-- Intro Text -->
        <div class="intro-text" id="introText">
            <div class="hello">Hello Guys,</div>
            <div class="engineers">"WE ARE ENGINEERS"</div>
        </div>

        <!-- Earth -->
        <div class="earth-container" id="earthContainer">
            <div class="earth">
                <div class="continent"></div>
                <div class="continent"></div>
                <div class="continent"></div>
                <div class="clouds"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="hero-section">
            <h1 class="project-title">PASSWORD GENERATOR</h1>
            <p class="subtitle">Secure • Advanced • Reliable</p>
            
            <div class="cyber-images">
                <div class="cyber-card">
                    <div class="cyber-icon">🔐</div>
                </div>
                <div class="cyber-card">
                    <div class="cyber-icon">🛡️</div>
                </div>
                <div class="cyber-card">
                    <div class="cyber-icon">💻</div>
                </div>
                <div class="cyber-card">
                    <div class="cyber-icon">🔒</div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="password-display">
                <div id="passwordOutput">Click generate to create password</div>
                <button class="copy-btn" onclick="copyPassword()">Copy</button>
            </div>

            <div class="strength-meter">
                <div class="strength-label">PASSWORD STRENGTH LEVEL</div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
            </div>

            <div class="options">
                <div class="option-group">
                    <div class="length-display">
                        <label>PASSWORD LENGTH</label>
                        <span class="length-value" id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="4" max="32" value="16">
                </div>

                <div class="option-group">
                    <label>CHARACTER OPTIONS:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">Uppercase Letters (A-Z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">Lowercase Letters (a-z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">Numbers (0-9)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">Symbols (!@#$%^&*)</label>
                        </div>
                    </div>
                </div>
            </div>

            <button class="generate-btn" onclick="generatePassword()">⚡ Generate Password ⚡</button>
        </div>

        <div class="footer">
            MADE BY SAI AND TEAM | GH RAISONI COLLEGE
        </div>
    </div>

    <div class="toast" id="toast">✓ Password Copied Successfully!</div>

    <script>
        // Create stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // Animation sequence
        const introScreen = document.getElementById('introScreen');
        const introText = document.getElementById('introText');
        const earthContainer = document.getElementById('earthContainer');

        // Show "Hello Guys, We Are Engineers" after rocket launches
        setTimeout(() => {
            introText.classList.add('show');
        }, 2000);

        // Transition to Earth zoom
        setTimeout(() => {
            introScreen.classList.remove('phase1');
            introScreen.classList.add('phase2');
            introText.style.opacity = '0';
            earthContainer.classList.add('show');
        }, 5000);

        // Complete intro and show main content
        setTimeout(() => {
            introScreen.classList.add('complete');
        }, 10000);

        // Password Generator Functions
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const passwordOutput = document.getElementById('passwordOutput');
        const strengthFill = document.getElementById('strengthFill');

        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
        });

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            const uppercase = document.getElementById('uppercase').checked;
            const lowercase = document.getElementById('lowercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const symbols = document.getElementById('symbols').checked;

            let charset = '';
            if (uppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lowercase) charset += 'abcdefghijklmnopqrstuvwxyz';
            if (numbers) charset += '0123456789';
            if (symbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (charset === '') {
                alert('Please select at least one character type!');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            passwordOutput.textContent = password;
            updateStrength(length, uppercase, lowercase, numbers, symbols);
        }

        function updateStrength(length, upper, lower, nums, syms) {
            let strength = 0;
            const types = [upper, lower, nums, syms].filter(Boolean).length;
            
            strength += Math.min(length / 32 * 50, 50);
            strength += types * 12.5;

            strengthFill.style.width = strength + '%';
            
            if (strength < 40) {
                strengthFill.style.background = '#ff4757';
            } else if (strength < 70) {
                strengthFill.style.background = '#ffa502';
            } else {
                strengthFill.style.background = '#00ff88';
            }
        }

        function copyPassword() {
            const password = passwordOutput.textContent;
            if (password === 'Click generate to create password') {
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Generate initial password after intro
        setTimeout(() => {
            generatePassword();
        }, 10500);
    </script>
</body>
</html>
